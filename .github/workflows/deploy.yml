# Why this exists: the repo rule is "deploy through the automated pipeline",
# and there was no pipeline. This is it.
#
# What it must not do: run on a push. Nine agents redeploying because someone
# fixed a typo in a README is how a demo cluster ends up mid-rollout on stage.
# Deploys are asked for, by hand, one agent or all nine.
#
# It fails loudly when the Nasiko login is missing rather than skipping. A
# human typed an agent name twice to get here, and a green run that deployed
# nothing serves them worse than a red one naming the secret to set.

name: deploy

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to deploy, or 'all' for the nine"
        required: true
        default: "bp-sov"
      confirm:
        description: "Type the agent name again to confirm"
        required: true

jobs:
  deploy:
    name: nasiko deploy
    runs-on: ubuntu-latest
    environment: nasiko
    # github.event.inputs is attacker-controllable on a public repo, so it goes
    # through env and never into a command line directly.
    env:
      AGENT: ${{ inputs.agent }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      - name: work out what to deploy
        id: targets
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$AGENT" != "$CONFIRM" ]; then
            echo "::error::confirmation '$CONFIRM' does not match agent '$AGENT'"
            exit 1
          fi
          # Shape, not an allowlist of the nine names: a hand-kept list drifts
          # the first time an agent is renamed. The second case is what stops
          # `bp-x/../../etc` from deploying an arbitrary directory.
          if [ "$AGENT" != "all" ]; then
            case "$AGENT" in
              bp-*) ;;
              *) echo "::error::'$AGENT' is not 'all' or a bp-* agent name"; exit 1 ;;
            esac
            case "$AGENT" in
              *[!a-z0-9-]*) echo "::error::'$AGENT' has a character outside a-z, 0-9 and dash"; exit 1 ;;
            esac
          fi
          shopt -s nullglob
          if [ "$AGENT" = "all" ]; then targets=(agents/bp-*); else targets=("agents/$AGENT"); fi
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::no agent directory matched, agents/ is still empty"
            exit 1
          fi
          for dir in "${targets[@]}"; do
            if [ ! -d "$dir" ]; then echo "::error::$dir is not a directory"; exit 1; fi
          done
          echo "dirs=${targets[*]}" >> "$GITHUB_OUTPUT"
          echo "deploying: ${targets[*]}"

      - name: we need a Nasiko login
        env:
          CONTROL_PLANE: ${{ secrets.NASIKO_CONTROL_PLANE_URL }}
          NASIKO_AUTH_TOKEN: ${{ secrets.NASIKO_AUTH_TOKEN }}
        run: |
          if [ -z "$CONTROL_PLANE" ] || [ -z "$NASIKO_AUTH_TOKEN" ]; then
            echo "::error::set NASIKO_CONTROL_PLANE_URL and NASIKO_AUTH_TOKEN on the 'nasiko' environment"
            exit 1
          fi

      # No published crate or release binary exists for Linux, so the CLI is
      # built from source as research/nasiko.md section 8 records. Pinned to a
      # commit: this build runs unsandboxed on a runner that later holds the
      # control-plane token, so a moving `main` is a moving trust boundary.
      # Bump by hand after reading the diff.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5
        with:
          repository: Nasiko-Labs/nasiko
          path: .nasiko-src
          ref: 58cfe600559c67d58100ec2856d7b29838e2859f

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable

      # Keyed on the pinned Cargo.lock, so this stays warm between dispatches.
      # Cold, the cli subtree is a 4-8 minute release build.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .nasiko-src

      - name: install the nasiko CLI
        run: cargo install --path .nasiko-src/cli --locked

      - name: connect and authenticate
        env:
          CONTROL_PLANE: ${{ secrets.NASIKO_CONTROL_PLANE_URL }}
          NASIKO_AUTH_TOKEN: ${{ secrets.NASIKO_AUTH_TOKEN }}
        run: |
          nasiko connect "$CONTROL_PLANE"
          nasiko auth login

      # Vault-wide, so every agent sees them. OTEL_EXPORTER_OTLP_ENDPOINT is
      # injected for nobody, Python included, which is why it is set here and
      # not assumed.
      - name: set vault-wide secrets
        env:
          ANAKIN_API_KEY: ${{ secrets.ANAKIN_API_KEY }}
          OTEL_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: |
          # Written as `if`, not `[ -n "$X" ] && cmd`. The runner uses bash -e,
          # where that idiom returns 1 for an unset optional secret and kills
          # the deploy.
          if [ -n "$ANAKIN_API_KEY" ]; then
            nasiko secrets set ANAKIN_API_KEY "$ANAKIN_API_KEY"
          else
            echo "::warning::ANAKIN_API_KEY unset, every collector will fail at runtime"
          fi
          if [ -n "$OTEL_ENDPOINT" ]; then
            nasiko secrets set OTEL_EXPORTER_OTLP_ENDPOINT "$OTEL_ENDPOINT"
          else
            echo "::notice::OTEL_EXPORTER_OTLP_ENDPOINT unset, agents run but are invisible to nasiko observe"
          fi

      - name: validate before deploying anything
        env:
          DIRS: ${{ steps.targets.outputs.dirs }}
        run: |
          python3 scripts/check_agent_cards.py
          for dir in $DIRS; do
            echo "== $dir"
            ( cd "$dir" && nasiko validate )
          done

      # Deploy, never upload. Both nasiko upload and the dashboard zip uploader
      # post to /api/agents/upload, whose validate_agent_zip requires a main.py
      # and rejects a Go agent with a 400.
      # The image is built here rather than by `nasiko deploy <dir>`, because
      # every agent Dockerfile needs the repo root as its build context: it
      # does `COPY go.*` and `COPY internal/`, neither of which exists inside
      # agents/<name>/. Handing nasiko the directory would give docker that
      # directory as the context and the build would fail on the first COPY.
      # `nasiko deploy` takes an image or a directory, so the image is the
      # form that lets us keep the context right.
      - name: deploy
        env:
          DIRS: ${{ steps.targets.outputs.dirs }}
        run: |
          for dir in $DIRS; do
            name=$(basename "$dir")
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$dir/AgentCard.json")
            echo "== building $name:$version"
            docker build -f "$dir/Dockerfile" -t "$name:$version" .
            echo "== deploying $name:$version"
            nasiko deploy "$name:$version" --name "$name"
          done

      - name: what is running now
        run: nasiko ps --json
