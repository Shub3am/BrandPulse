# Why this exists: six tracks work in six worktrees and nothing else checks
# that they still compile together. It must never need a credential, because a
# CI run that can only pass with a key is a CI run that stops running.
#
# What it must not do: spend an Anakin credit, reach the network for fixtures,
# or deploy. BP_FIXTURE_MODE=replay is what holds that line. Deploy lives in
# deploy.yml.

name: ci

on:
  push:
    branches: ["main", "track/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Seven tracks pushing all afternoon otherwise queue behind each other for
# results nobody reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BP_FIXTURE_MODE: replay

jobs:
  go:
    name: go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      - uses: actions/setup-go@e626ada899467caf4efc6cfd0484b965da944ce8 # v6
        with:
          go-version-file: go.mod
          cache: true

      # A tree that only builds after an implicit tidy is a tree that breaks on
      # the next machine.
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go build ./...

      - run: go vet ./...

      - name: go test
        run: go test ./... 2>&1 | tee test.log

      # Every package reporting "no test files" is the state this repo was in
      # when CI was added, and it passes `go test` silently. Say it out loud on
      # every run so "CI is green" cannot come to mean "nothing is tested".
      # It goes quiet on its own the day any single test lands.
      - name: report how much is actually tested
        run: |
          total=$(go list ./... | wc -l)
          untested=$(grep -c 'no test files' test.log || true)
          echo "::notice::$untested of $total packages have no test files"
          if [ "$untested" = "$total" ]; then
            echo "::warning::No package in this repo has a single test. go test passed vacuously."
          fi

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      - uses: actions/setup-node@db0fb3a98ed314b69026b6e8c9be26a7e2fe65a8 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Ahead of the build on purpose. `next build` type-checks too, but it
      # reports the first error after a full compile; this reports all of them
      # in seconds.
      - run: npm run typecheck

      - run: npm run build

  cards:
    name: AgentCards validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      # Its own job so a broken card is not buried under a Go build failure.
      # The same script runs on a laptop, which is the point: tracks can check
      # a card before anyone has a Nasiko login.
      - name: every card carries both shapes
        run: python3 scripts/check_agent_cards.py
